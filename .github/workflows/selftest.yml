# The self-test, on the three hosted runner platforms.
#
# ./selftest.sh installs the pipeline into throwaway repos and runs every shipped guard's suite
# there. test/selftest-in-container.sh does that on a clean Ubuntu in Docker; this workflow does
# it on ubuntu-latest, macos-latest (Homebrew bash: the stock /bin/bash is 3.2) and windows-latest
# (Git Bash, which is what `shell: bash` resolves to there). The self-test hides cairn from PATH
# itself for the installer's required-command branch, so there is no separate no-store job. Each
# job prints one `box:` line, the RESULT line and every FAIL into the run summary and keeps the
# full log as an artifact; after a failure it also keeps the installer's own output and every
# suite's full log, since the self-test shows only the last 35 lines of a failing suite.
#
# cairn comes from github.com/scgoetsch/cairn at the commit CAIRN_REF names (cairn has no release
# tags yet), cloned into a directory of its own and put on PATH through a one-line wrapper in
# $HOME/cairn-bin: the self-test's no-cairn probe hides every PATH directory carrying a cairn
# executable and needs git and python3 to survive that, and a symlink would be a copy under MSYS.
# Bump CAIRN_REF on purpose, or pass cairn_ref to a manual run. cairn needs Python 3.9+ and
# nothing else.
#
# Every job is a gate. If a platform regresses for a reason that takes time, allow-failure on its
# matrix entry is the honest stopgap: the workflow stays green with that job red, and the summary
# says which suites.
name: self-test

on:
  push:
  workflow_dispatch:
    inputs:
      cairn_ref:
        description: cairn commit to install (default is CAIRN_REF in the workflow)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

env:
  # cairn 0.7.0 (the first that keeps the tracked files in .cairn/), main at 2026-11-08.
  CAIRN_REF: ${{ inputs.cairn_ref || '5aec6b002e60cd05abddeb281beb6faa6faec3ce' }}

jobs:
  selftest:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: ubuntu
            os: ubuntu-latest
            allow-failure: false
          - key: macos
            os: macos-latest
            allow-failure: false
          - key: windows
            os: windows-latest
            allow-failure: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: "macOS: bash ≥ 4 and ripgrep from Homebrew"
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bash ripgrep
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: "Linux: ripgrep (optional; sweep_test's bare-grep hazard demonstration)"
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep

      - name: "Windows: ripgrep, and a python3 name if the image offers only python"
        if: runner.os == 'Windows'
        run: |
          choco install ripgrep -y --no-progress >/dev/null
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/shims"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$HOME/shims/python3"
            chmod +x "$HOME/shims/python3"
            echo "$(cygpath -w "$HOME/shims")" >> "$GITHUB_PATH"
            echo "python3 shim -> $(command -v python)"
          fi

      - name: "cairn at CAIRN_REF, on PATH through a wrapper in its own directory"
        run: |
          src=$HOME/cairn-src; bin=$HOME/cairn-bin
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/scgoetsch/cairn "$CAIRN_REF"
          git -C "$src" checkout -q FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$CAIRN_REF" ] || { echo "cairn checkout is not $CAIRN_REF" >&2; exit 1; }
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec python3 "%s/bin/cairn" "$@"\n' "$src" > "$bin/cairn"
          chmod +x "$bin/cairn"
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) echo "$(cygpath -w "$bin")" >> "$GITHUB_PATH" ;;
            *)                    echo "$bin" >> "$GITHUB_PATH" ;;
          esac
          "$bin/cairn" --version

      - name: git identity for the throwaway repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main

      - name: box
        run: |
          has() { command -v "$1" >/dev/null 2>&1 && echo yes || echo no; }
          { printf 'box: %s %s  bash %s  git %s  python3 %s  cairn %s (%s)\n' \
              "$(uname -s)" "$(uname -r)" "$BASH_VERSION" "$(git --version | awk '{print $3}')" \
              "$(python3 --version 2>&1 | awk '{print $2}')" \
              "$(cairn --version 2>/dev/null | head -1 || echo absent)" "${CAIRN_REF:0:12}"
            printf 'optional: jq %s  rg %s  ss %s  flock %s  setsid %s  timeout %s  iconv %s  node %s  utf8 locale: %s\n' \
              "$(has jq)" "$(has rg)" "$(has ss)" "$(has flock)" "$(has setsid)" "$(has timeout)" "$(has iconv)" \
              "$(node --version 2>/dev/null || echo no)" \
              "$(locale -a 2>/dev/null | grep -i -E '^c\.utf-?8$|^en_US\.utf-?8$' | tr '\n' ' ' || echo none)"
            printf 'resolved: bash=%s python3=%s cairn=%s timeout=%s  python3 stdout newline:%s\n' \
              "$(command -v bash)" "$(command -v python3 || echo none)" "$(command -v cairn || echo none)" \
              "$(command -v timeout || echo none)" "$(python3 -c 'print(1)' | od -An -c | tr -s ' ')"
            # Line endings as git sees them (i/ index, w/ working tree) and as bytes: the first
            # line of selftest.sh must end in \n alone, whatever core.autocrlf the box ships.
            printf 'eol: %s  core.autocrlf=%s  first line bytes: %s\n' \
              "$(git ls-files --eol selftest.sh | awk '{print $1, $2}')" \
              "$(git config --show-origin --get core.autocrlf || echo unset)" \
              "$(head -1 selftest.sh | od -An -c | tr -s ' ' | tail -c 24 | tr '\n' ' ')"
          } | tee box.txt

      - name: ./selftest.sh
        run: ./selftest.sh 2>&1 | tee selftest.log

      - name: "after a failure: the installer's own output, and every suite in full"
        if: failure()
        run: |
          out=$PWD/suite-logs; mkdir -p "$out"
          t=$(mktemp -d); git -C "$t" init -q
          ./install.sh --with-pi "$t" > "$out/install.log" 2>&1 || echo "install.sh exit $? — its ! lines:"
          grep -E '^ *!' "$out/install.log" || true
          for s in "$t"/tools/*_test.sh; do
            n=$(basename "$s" .sh)
            if (cd "$t" && "./tools/$n.sh") > "$out/$n.log" 2>&1; then echo "PASS $n"
            else echo "FAIL $n (exit $?) — $out/$n.log"; fi
          done
          rm -rf "$t"

      - name: summary
        if: always()
        run: |
          strip() { perl -pe 's/\e\[[0-9;]*m//g'; }
          { echo "### ${{ matrix.key }} (${{ matrix.os }})"
            echo
            echo '```'
            cat box.txt 2>/dev/null || true
            grep -E 'RESULT:' selftest.log 2>/dev/null | strip | tail -1 \
              || echo "no RESULT line: the self-test did not run to its end"
            grep -E 'FAIL|^  SKIP' selftest.log 2>/dev/null | strip | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-${{ matrix.key }}
          path: selftest.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: suite-logs-${{ matrix.key }}
          path: suite-logs/
          if-no-files-found: ignore
